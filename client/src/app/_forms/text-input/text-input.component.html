<div class="mb-3 form-floating">
    <input [class.is-invalid]="control.touched && control.invalid" [type]="type()" class="form-control" [formControl]="control" placeholder="{{label()}}">
    <label>Password</label>
    <div *ngIf="registerForm.get('password')?.hasError('required')" class="invalid-feedback text-start"></div> 






    
</div>
